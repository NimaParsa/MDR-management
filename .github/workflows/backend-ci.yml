name: Backend CI

on:
  push:
    branches:
      - backend-import
  pull_request:
    branches:
      - backend-import

permissions:
  contents: read

jobs:
  syntax-check:
    name: Node.js syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          set -e
          find . -path ./node_modules -prune -o -name "*.js" -type f -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Run automated tests
        run: npm test

  frontend-build:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
